name: 'Security scan'

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Blocking: a leaked secret fails the run.
  secrets:
    if: github.repository == 'hululsofthq/nezzel-desktop'
    name: 'Secret scan (gitleaks)'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install gitleaks (pinned release, sha256 checked)
        run: |
          curl -fsSL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/gitleaks"
          tar -xzf gitleaks.tar.gz -C "$RUNNER_TEMP/gitleaks" gitleaks
          rm gitleaks.tar.gz

      - name: Scan the tree
        run: '"$RUNNER_TEMP/gitleaks/gitleaks" dir . --no-banner --redact --exit-code 1'

  # Warn only for now: findings show in the log but do not fail the run.
  deps:
    if: github.repository == 'hululsofthq/nezzel-desktop'
    name: 'Dependency scan (warn only)'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: pnpm audit
        continue-on-error: true
        run: pnpm audit --prod

      - name: Install osv-scanner (pinned release, sha256 checked)
        run: |
          curl -fsSL -o osv-scanner https://github.com/google/osv-scanner/releases/download/v2.7.1/osv-scanner_linux_amd64
          echo "fb7dab19a8bd9bbe5c3189f09d4b7ee1820c9553a23bac202648a56efd2f6ee8  osv-scanner" | sha256sum -c -
          chmod +x osv-scanner

      - name: osv-scanner
        run: ./osv-scanner scan source -L pnpm-lock.yaml -L src-tauri/Cargo.lock
